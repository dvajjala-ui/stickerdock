<body><header class="topbar"><a class="brand" href="/about">StickerDock</a><a href="/admin">Admin</a></header><main><section class="panel editor"><h1>Your StickerDock account</h1><p id="account-status" role="status">Reset your password using the email address you registered with.</p><form id="recover-form"><label>Email<input id="recover-email" type="email" autocomplete="username" required></label><button class="primary" type="submit">Send password reset link</button><p class="hint">This page resets your phone cloud-account password. Create a phone account in the app. <a href="/admin">Admin opens directly without a password.</a></p></form><form id="password-form" hidden><label>New password<input id="new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>Confirm password<input id="confirm-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button class="primary" type="submit">Save password</button></form><p><a href="/admin">Open Admin</a> · <a href="/support">Support</a> · <a href="/privacy">Privacy</a></p></section></main></body></html>
