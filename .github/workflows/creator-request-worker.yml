name: Creator request worker

on:
  workflow_dispatch:

concurrency:
  group: creator-request-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-stickers.txt
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt
      - name: Verify creator worker configuration
        run: |
          python - <<'PY'
          import os
          required = ("GROQ_API_KEY", "SUPABASE_SERVICE_ROLE_KEY")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing Creator worker secrets: " + ", ".join(missing))
          PY
      - name: Process at most one queued Creator request
        run: python tools/creator_request_worker.py
