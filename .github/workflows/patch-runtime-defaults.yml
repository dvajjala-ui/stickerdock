name: Patch production runtime defaults

on:
  push:
    branches:
      - chore/production-runtime-defaults
    paths:
      - '.github/workflows/patch-runtime-defaults.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-runtime-defaults

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-stickers.txt
            tools/requirements-pinterest.txt

      - name: Apply exact runtime-default patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          exact = {
              'tools/daily_stickers.py': (
                  'config.get("model", "llama-3.3-70b-versatile")',
                  'config.get("model", "openai/gpt-oss-20b")',
              ),
              'tools/production_worker.py': (
                  'config.get("model", "llama-3.3-70b-versatile")',
                  'config.get("model", "openai/gpt-oss-20b")',
              ),
          }
          for name, (old, new) in exact.items():
              path = Path(name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one deprecated fallback, found {count}')
              path.write_text(text.replace(old, new))

          def replace_env_line(name, key, value):
              path = Path(name)
              lines = path.read_text().splitlines()
              matches = [i for i, line in enumerate(lines) if line.lstrip().startswith(key + ':')]
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one {key} line, found {len(matches)}')
              i = matches[0]
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines[i] = f'{indent}{key}: {value}'
              path.write_text('\n'.join(lines) + '\n')

          project_url = 'https://qqicsllktmcmvmzplsxl.supabase.co'
          for name in (
              '.github/workflows/sticker-factory.yml',
              '.github/workflows/creator-request-worker.yml',
              '.github/workflows/storage-usage.yml',
              '.github/workflows/publish-factory-pack.yml',
              '.github/workflows/pinterest-autosync.yml',
          ):
              replace_env_line(name, 'SUPABASE_URL', project_url)

          for name in (
              '.github/workflows/sticker-factory.yml',
              '.github/workflows/creator-request-worker.yml',
          ):
              replace_env_line(name, 'GROQ_VISION_MODEL', 'qwen/qwen3.8-27b')

          for name in (
              'tools/daily_stickers.py',
              'tools/production_worker.py',
              'tools/factory-production.json',
              'tools/daily-stickers.example.json',
          ):
              if 'llama-3.3-70b-versatile' in Path(name).read_text():
                  raise SystemExit(f'{name}: deprecated Groq model remains')
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt

      - name: Run Python helper tests and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools
          python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Commit validated defaults and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-runtime-defaults.yml
          git config user.name "dvajjala-ui"
          git config user.email "dvajjala@gmail.com"
          git add -A
          git commit -m "Use current production runtime defaults"
          git push origin HEAD:chore/production-runtime-defaults
