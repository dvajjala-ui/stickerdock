name: Supabase storage usage

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

concurrency:
  group: storage-usage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || vars.STORAGE_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_QUOTA_MB: ${{ vars.SUPABASE_STORAGE_QUOTA_MB }}
      SUPABASE_STORAGE_WARN_PERCENT: ${{ vars.SUPABASE_STORAGE_WARN_PERCENT || '70' }}
      SUPABASE_STORAGE_FAIL_PERCENT: ${{ vars.SUPABASE_STORAGE_FAIL_PERCENT || '90' }}
      PRIVATE_GENERATED_RETENTION_DAYS: ${{ vars.PRIVATE_GENERATED_RETENTION_DAYS || '30' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify Supabase monitoring configuration
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip():
              raise SystemExit("Missing storage monitor secret: SUPABASE_SERVICE_ROLE_KEY")
          PY
      - name: Report storage usage and retention candidates
        run: python tools/storage_usage.py
