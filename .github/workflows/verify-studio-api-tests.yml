name: Verify Studio API test preservation

on:
  push:
    branches:
      - feat/creator-studio-live-ai
    paths:
      - '.github/workflows/verify-studio-api-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creator-studio-live-ai
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run complete Studio API regression module
        run: python -m unittest discover -s tools -p 'test_studio_api.py' -v
