name: Apply Creator lease migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-creator-lease-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qqicsllktmcmvmzplsxl
      POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build masked database URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo 'SUPABASE_DB_PASSWORD is not configured' >&2
            exit 2
          fi
          DB_URL=$(python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{os.environ['PROJECT_REF']}:{password}@{os.environ['POOLER_HOST']}:5432/postgres?sslmode=require")
          PY
          )
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Dry-run pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase init
          supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$DB_URL"

      - name: Verify Creator lease recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          test "$(psql "$DB_URL" -Atc "select count(*) from pg_indexes where schemaname='public' and indexname='idx_creator_requests_running_lease';")" = "1"
          test "$(psql "$DB_URL" -Atc "select position('20 minutes' in pg_get_functiondef('public.claim_creator_request(text)'::regprocedure)) > 0;")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('service_role','public.claim_creator_request(text)','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('anon','public.claim_creator_request(text)','EXECUTE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.claim_creator_request(text)','EXECUTE');")" = "f"
          STALE=$(psql "$DB_URL" -Atc "select count(*) from public.creator_requests where status='running' and started_at < now() - interval '20 minutes';")
          echo "stale_running_requests=$STALE"
          echo 'Creator lease migration verified'
