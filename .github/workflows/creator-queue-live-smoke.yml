name: Creator queue live smoke

on:
  push:
    branches:
      - test/live-factory-smoke-20261013
    paths:
      - '.github/workflows/creator-queue-live-smoke.yml'

permissions:
  contents: read

jobs:
  creator-queue-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-factory-smoke-20261013

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-stickers.txt

      - name: Install Creator worker dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-stickers.txt
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || {
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          }

      - name: Ensure queue is empty and create isolated test request
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import binascii
          import hashlib
          import json
          import os
          import struct
          import urllib.parse
          import uuid
          import zlib
          from supabase_factory import PRIVATE_BUCKET, SupabaseFactory

          client = SupabaseFactory()
          queued = json.loads(client._request(
              'GET', '/rest/v1/creator_requests?status=eq.queued&select=id,created_at&order=created_at.asc&limit=1'
          ) or b'[]')
          if queued:
              raise SystemExit('Creator queue is not empty; refusing to consume a possibly real request')

          request_id = str(uuid.uuid4())
          seed = uuid.UUID(request_id).bytes
          width = height = 96
          def chunk(kind, data):
              body = kind + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', binascii.crc32(body) & 0xffffffff)
          rows = []
          for y in range(height):
              row = bytearray(b'\x00')
              for x in range(width):
                  r = (seed[(x + y) % 16] + x * 3) % 256
                  g = (seed[(x * 3 + y) % 16] + y * 5) % 256
                  b = (80 + x + y) % 256
                  row.extend((r, g, b, 255))
              rows.append(bytes(row))
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
          png += chunk(b'IEND', b'')
          digest = hashlib.sha256(png).hexdigest()
          source_path = f'inbox/{digest}.png'
          metadata_path = f'source-metadata/{digest}.json'
          metadata = {
              'source': 'creator-live-smoke',
              'source_url': 'smoke://generated-fixture',
              'download_url': 'smoke://generated-fixture',
              'license': 'USER_OWNED',
              'credit': 'StickerDock automated production smoke test'
          }
          client.upload(PRIVATE_BUCKET, source_path, png, 'image/png')
          client.upload(PRIVATE_BUCKET, metadata_path,
                        json.dumps(metadata, separators=(',', ':')).encode(), 'application/json')
          client.upsert('creator_requests', [{
              'id': request_id,
              'source_path': source_path,
              'prompt': 'Write one short friendly Hinglish reaction caption for this abstract colorful image.',
              'status': 'queued'
          }], 'id')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'CREATOR_SMOKE_ID={request_id}\n')
              env.write(f'CREATOR_SMOKE_SOURCE={source_path}\n')
              env.write(f'CREATOR_SMOKE_SOURCE_META={metadata_path}\n')
          print(json.dumps({'request_created': True, 'source_bytes': len(png)}))
          PY

      - name: Run real Creator vision worker
        shell: bash
        run: |
          set -euo pipefail
          python tools/creator_request_worker.py | tee /tmp/creator-worker-result.json

      - name: Verify completed request, WebP result and provenance
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import hashlib
          import json
          import os
          from supabase_factory import PRIVATE_BUCKET, SupabaseFactory

          client = SupabaseFactory()
          request_id = os.environ['CREATOR_SMOKE_ID']
          row = client.find('creator_requests', 'id', request_id)
          if not row or row.get('status') != 'complete':
              raise SystemExit('Creator smoke request did not complete: ' + json.dumps(row, default=str))
          if int(row.get('attempts') or 0) != 1:
              raise SystemExit('Creator request should be claimed exactly once')
          result_path = row.get('result_path') or ''
          if not result_path.startswith('inbox/') or not result_path.endswith('.webp'):
              raise SystemExit('Creator result path is invalid')
          sticker = client.download(PRIVATE_BUCKET, result_path)
          if not (12 <= len(sticker) <= 100_000 and sticker.startswith(b'RIFF') and sticker[8:12] == b'WEBP'):
              raise SystemExit('Creator result is not a bounded static WebP')
          digest = hashlib.sha256(sticker).hexdigest()
          if result_path != f'inbox/{digest}.webp':
              raise SystemExit('Creator result path does not match result hash')
          result_meta_path = f'source-metadata/{digest}.json'
          metadata = json.loads(client.download(PRIVATE_BUCKET, result_meta_path))
          if metadata.get('creator_request_id') != request_id:
              raise SystemExit('Creator result provenance does not point to the request')
          if metadata.get('derived_from') != os.environ['CREATOR_SMOKE_SOURCE']:
              raise SystemExit('Creator result provenance does not point to the source')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'CREATOR_SMOKE_RESULT={result_path}\n')
              env.write(f'CREATOR_SMOKE_RESULT_META={result_meta_path}\n')
          print(json.dumps({
              'status': row.get('status'),
              'attempts': row.get('attempts'),
              'result_bytes': len(sticker),
              'result_webp': True,
              'provenance_verified': True
          }, sort_keys=True))
          PY

      - name: Clean isolated Creator smoke data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json
          import os
          import urllib.parse
          from supabase_factory import PRIVATE_BUCKET, SupabaseFactory

          request_id = os.environ.get('CREATOR_SMOKE_ID', '').strip()
          if not request_id:
              print('No Creator smoke request was created; nothing to clean')
              raise SystemExit(0)
          client = SupabaseFactory()
          row = client.find('creator_requests', 'id', request_id)
          result_path = os.environ.get('CREATOR_SMOKE_RESULT', '').strip()
          if not result_path and row:
              result_path = str(row.get('result_path') or '')
          paths = [
              os.environ.get('CREATOR_SMOKE_SOURCE', '').strip(),
              os.environ.get('CREATOR_SMOKE_SOURCE_META', '').strip(),
              result_path,
              os.environ.get('CREATOR_SMOKE_RESULT_META', '').strip(),
          ]
          if result_path and not os.environ.get('CREATOR_SMOKE_RESULT_META') and result_path.startswith('inbox/') and result_path.endswith('.webp'):
              paths.append('source-metadata/' + result_path[6:-5] + '.json')
          deleted = 0
          for path in dict.fromkeys(p for p in paths if p):
              endpoint = '/storage/v1/object/' + urllib.parse.quote(PRIVATE_BUCKET, safe='') + '/' + urllib.parse.quote(path, safe='/')
              try:
                  client._request('DELETE', endpoint)
                  deleted += 1
              except Exception as error:
                  print(f'cleanup warning for {path}: {type(error).__name__}')
          client._request('DELETE', '/rest/v1/creator_requests?id=eq.' + urllib.parse.quote(request_id),
                          headers={'Prefer': 'return=minimal'})
          if client.find('creator_requests', 'id', request_id) is not None:
              raise SystemExit('Creator smoke request cleanup failed')
          print(json.dumps({'request_deleted': True, 'storage_delete_calls': deleted}))
          PY
