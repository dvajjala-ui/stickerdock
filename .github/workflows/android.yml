name: Android debug build
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'sticker-core/**'
      - 'api/**'
      - 'admin/**'
      - 'supabase/**'
      - 'vercel.json'
      - 'tools/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'sticker-core/**'
      - 'api/**'
      - 'admin/**'
      - 'supabase/**'
      - 'vercel.json'
      - 'tools/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/android.yml'
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36 using runner SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --licenses <<< "y" || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Validate local ADB migration helper
        run: |
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python3 -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt -r tools/requirements-checks.txt
          python3 -m ruff check api tools --select F821,F822,F823
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          node --check admin/app.js
      - name: Test, lint, and build APK plus release bundle
        run: |
          gradle --no-daemon \
            :sticker-core:jvmTest \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease
      - name: Verify 16 KB native-library compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 "$APK"
          rm -rf /tmp/stickerdock-native
          mkdir -p /tmp/stickerdock-native
          unzip -q "$APK" 'lib/*/*.so' -d /tmp/stickerdock-native
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('/tmp/stickerdock-native/lib')
          checked = []
          for abi in ('arm64-v8a', 'x86_64'):
              folder = root / abi
              if not folder.exists():
                  continue
              for so in sorted(folder.glob('*.so')):
                  out = subprocess.check_output(['readelf', '-lW', str(so)], text=True)
                  aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                            if line.lstrip().startswith('LOAD ')]
                  if not aligns:
                      raise SystemExit(f'No LOAD segments found in {abi}/{so.name}')
                  minimum = min(aligns)
                  print(f'{abi}/{so.name}: minimum LOAD alignment=0x{minimum:x}')
                  if minimum < 0x4000:
                      raise SystemExit(f'16 KB ELF alignment failed for {abi}/{so.name}')
                  checked.append(f'{abi}/{so.name}')
          if not checked:
              raise SystemExit('Expected 64-bit native libraries but none were found')
          print('16 KB ELF alignment verified:', ', '.join(checked))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: stickerdock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stickerdock-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            sticker-core/build/reports/tests/
            sticker-core/build/test-results/
