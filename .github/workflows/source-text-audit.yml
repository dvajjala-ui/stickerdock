name: Audit existing Factory source text
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-source-text-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-stickers.txt
      - run: bash tools/ci_text_tools.sh
      - run: python tools/check_text_screening.py
      - name: Inspect existing private source pixels without generating or writing
        run: python tools/audit_factory_source_text.py
