name: Patch Creator Studio live AI

on:
  push:
    branches:
      - feat/creator-studio-live-ai
    paths:
      - '.github/workflows/patch-creator-studio-live-ai.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creator-studio-live-ai

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements-stickers.txt

      - name: Apply production Creator Studio patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {found}')
              p.write_text(text.replace(old, new, count))

          replace_exact('api/_shared.py',
              '    headers = {"apikey": key, "Authorization": "Bearer " + key}\n',
              '    headers = {"apikey": key}\n'
              '    # New sb_secret_* API keys are opaque secrets, not JWT bearer tokens.\n'
              '    # Legacy service_role JWTs keep Authorization for backwards compatibility.\n'
              '    if not key.startswith("sb_secret_"):\n'
              '        headers["Authorization"] = "Bearer " + key\n')

          replace_exact('studio/index.html',
              '      <p class="intro-copy">Pick a local image or load one from the private factory inbox. Write and style the caption yourself, then download it or queue it for the daily factory. AI prompts are coming soon.</p>',
              '      <p class="intro-copy">Pick a local image or load one from the private factory inbox. Style it yourself, or send the source to the private AI worker for a generated Hinglish reaction sticker.</p>')
          replace_exact('studio/index.html',
              '        <label>AI idea prompt — Coming soon\n          <textarea id="prompt" maxlength="600" rows="3" disabled placeholder="AI prompts will be processed by the private factory"></textarea>\n        </label>\n        <button id="generate" class="ai" disabled>AI captions coming soon <span>✦</span></button>',
              '        <label>AI sticker prompt\n          <textarea id="prompt" maxlength="500" rows="3" placeholder="Make a short friendly Hinglish reaction for this image"></textarea>\n        </label>\n        <button id="generate" class="ai" disabled>Generate with private AI <span>✦</span></button>')

          replace_exact('studio/app.js',
              '  let dragging = false;\n  let sourcePath = null;\n',
              '  let dragging = false;\n  let sourcePath = null;\n  let aiBusy = false;\n\n'
              '  const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));\n')
          replace_exact('studio/app.js',
              '  $("token").value = sessionStorage.getItem("stickerdock-studio-token") || "";\n  $("token").addEventListener("change", () => sessionStorage.setItem("stickerdock-studio-token", token()));\n',
              '  $("token").value = sessionStorage.getItem("stickerdock-studio-token") || "";\n'
              '  const updateAiButton = () => {\n'
              '    $("generate").disabled = aiBusy || !ready || !token() || !$("prompt").value.trim();\n'
              '  };\n'
              '  $("token").addEventListener("input", () => {\n'
              '    sessionStorage.setItem("stickerdock-studio-token", token());\n'
              '    updateAiButton();\n'
              '  });\n')
          replace_exact('studio/app.js',
              '  function loadDataUrl(url, originPath = null) {\n',
              '  function loadDataUrl(url, originPath = null, readyMessage = "Image ready. Add a caption and style it, or use the private AI worker.") {\n')
          replace_exact('studio/app.js',
              '      $("upload").disabled = false;\n      draw();\n      status("Image ready. Add a caption and style it. AI prompts are coming soon.");\n',
              '      $("upload").disabled = false;\n      draw();\n      updateAiButton();\n      status(readyMessage);\n')
          replace_exact('studio/app.js',
              '  $("file").addEventListener("change", (event) => loadFile(event.target.files[0]));\n',
              '  async function ensureAiSource() {\n'
              '    if (sourcePath) return sourcePath;\n'
              '    if (!ready || !image.src.startsWith("data:image/")) throw new Error("Choose an image first.");\n'
              '    status("Saving the source to the private factory inbox…");\n'
              '    const result = await api("/api/upload", {image: image.src, title: "Creator AI source"});\n'
              '    sourcePath = result.path;\n'
              '    return sourcePath;\n'
              '  }\n\n'
              '  async function waitForAiRequest(id) {\n'
              '    for (let attempt = 0; attempt < 240; attempt += 1) {\n'
              '      const result = await api("/api/captions", {action: "status", id});\n'
              '      if (result.status === "complete") return result;\n'
              '      if (result.status === "failed" || result.status === "cancelled") {\n'
              '        throw new Error(result.error_message || `AI request ${result.status}.`);\n'
              '      }\n'
              '      status(result.status === "running" ? "AI worker is creating your sticker…" : "AI request queued. The private worker checks every 10 minutes…");\n'
              '      await sleep(5000);\n'
              '    }\n'
              '    throw new Error("AI request is still queued. You can leave this page and try again later.");\n'
              '  }\n\n'
              '  $("prompt").addEventListener("input", updateAiButton);\n'
              '  $("generate").addEventListener("click", async () => {\n'
              '    if (aiBusy) return;\n'
              '    const prompt = $("prompt").value.trim();\n'
              '    if (!prompt) { status("Describe the AI sticker you want first.", true); return; }\n'
              '    aiBusy = true; updateAiButton();\n'
              '    try {\n'
              '      const path = await ensureAiSource();\n'
              '      status("Queueing a private AI sticker request…");\n'
              '      const queued = await api("/api/captions", {action: "queue", prompt, source_path: path});\n'
              '      const completed = await waitForAiRequest(queued.id);\n'
              '      const result = await api("/api/library", {action: "fetch", path: completed.result_path});\n'
              '      $("caption").value = "";\n'
              '      loadDataUrl(result.image, completed.result_path, "AI sticker ready. Download it or continue editing.");\n'
              '    } catch (error) { status(error.message, true); }\n'
              '    finally { aiBusy = false; updateAiButton(); }\n'
              '  });\n\n'
              '  $("file").addEventListener("change", (event) => loadFile(event.target.files[0]));\n')
          replace_exact('studio/app.js',
              '  draw();\n})();\n',
              '  draw();\n  updateAiButton();\n})();\n')

          replace_exact('.github/workflows/creator-request-worker.yml',
              'on:\n  workflow_dispatch:\n',
              "on:\n  workflow_dispatch:\n  schedule:\n    - cron: '*/10 * * * *'\n")
          replace_exact('.github/workflows/creator-request-worker.yml',
              "    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n",
              "    steps:\n      - uses: actions/checkout@v4\n      - name: Check for queued Creator requests\n        id: queue\n        shell: bash\n        run: |\n          python - <<'PY'\n          import json, os, urllib.request\n          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()\n          headers = {'apikey': key}\n          if not key.startswith('sb_secret_'):\n              headers['Authorization'] = 'Bearer ' + key\n          url = os.environ['SUPABASE_URL'].rstrip('/') + '/rest/v1/creator_requests?status=eq.queued&select=id&limit=1'\n          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:\n              rows = json.load(response)\n          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:\n              output.write('has_queue=' + ('true' if rows else 'false') + '\\n')\n          print('Queued Creator request found' if rows else 'Creator queue is empty')\n          PY\n      - uses: actions/setup-python@v5\n        if: steps.queue.outputs.has_queue == 'true'\n")
          replace_exact('.github/workflows/creator-request-worker.yml',
              '      - name: Install rendering dependencies\n        run: |\n',
              "      - name: Install rendering dependencies\n        if: steps.queue.outputs.has_queue == 'true'\n        run: |\n")
          replace_exact('.github/workflows/creator-request-worker.yml',
              '      - name: Verify creator worker configuration\n        run: |\n',
              "      - name: Verify creator worker configuration\n        if: steps.queue.outputs.has_queue == 'true'\n        run: |\n")
          replace_exact('.github/workflows/creator-request-worker.yml',
              '      - name: Process at most one queued Creator request\n        run: python tools/creator_request_worker.py\n',
              "      - name: Process up to five queued Creator requests\n        if: steps.queue.outputs.has_queue == 'true'\n        shell: bash\n        run: |\n          set -euo pipefail\n          for _ in {1..5}; do\n            result=$(python tools/creator_request_worker.py)\n            echo \"$result\"\n            if [[ \"$result\" == *'\"status\":\"idle\"'* ]]; then\n              break\n            fi\n          done\n")

          Path('tools/test_studio_api.py').write_text('''import json\nimport os\nimport unittest\nfrom unittest.mock import patch\n\nfrom api import _shared as studio\n\n\nclass StudioSupabaseAuthTest(unittest.TestCase):\n    def _headers_for(self, key):\n        captured = {}\n        def fake_request(url, method="GET", data=None, headers=None, limit=None, missing_ok=False):\n            captured.update(headers or {})\n            return b"[]"\n        with patch.dict(os.environ, {"SUPABASE_URL": "https://example.supabase.co", "SUPABASE_SERVICE_ROLE_KEY": key}, clear=False), patch.object(studio, "request", side_effect=fake_request):\n            studio.supabase_request("/rest/v1/creator_requests")\n        return captured\n\n    def test_new_secret_key_is_apikey_only(self):\n        headers = self._headers_for("sb_secret_test-only")\n        self.assertEqual(headers["apikey"], "sb_secret_test-only")\n        self.assertNotIn("Authorization", headers)\n\n    def test_legacy_service_role_keeps_bearer(self):\n        headers = self._headers_for("legacy-service-role")\n        self.assertEqual(headers["apikey"], "legacy-service-role")\n        self.assertEqual(headers["Authorization"], "Bearer legacy-service-role")\n\n    def test_queue_request_validates_and_posts(self):\n        calls = []\n        with patch.object(studio, "supabase_request", side_effect=lambda *a, **kw: calls.append((a, kw)) or b""):\n            result = studio.queue_creator_request("  friendly   reaction ", "inbox/" + "a" * 64 + ".png")\n        self.assertEqual(result["status"], "queued")\n        args, kwargs = calls[0]\n        self.assertEqual(args[0], "/rest/v1/creator_requests")\n        self.assertEqual(kwargs["method"], "POST")\n        payload = json.loads(kwargs["data"])\n        self.assertEqual(payload[0]["prompt"], "friendly reaction")\n        self.assertEqual(payload[0]["status"], "queued")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY

      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt -r tools/requirements-stickers.txt

      - name: Run Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q api tools
          python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exercise AI queue UI in Chromium with mocked hosted APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import binascii, struct, zlib
          def chunk(kind, data):
              body = kind + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', binascii.crc32(body) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'\
              + chunk(b'IHDR', struct.pack('>IIBBBBB', 64, 64, 8, 6, 0, 0, 0))\
              + chunk(b'IDAT', zlib.compress((b'\x00' + b'\x44\x99\xdd\xff' * 64) * 64, 9))\
              + chunk(b'IEND', b'')
          open('/tmp/source.png', 'wb').write(png)
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/studio/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const assert = require('assert');
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const pngData = 'data:image/png;base64,' + fs.readFileSync('/tmp/source.png').toString('base64');
            let statusCalls = 0;
            let uploadCalls = 0;
            await page.route('**/api/upload', async route => {
              uploadCalls += 1;
              await route.fulfill({status:200, contentType:'application/json', body:JSON.stringify({path:'inbox/' + 'a'.repeat(64) + '.png', sha256:'a'.repeat(64)})});
            });
            await page.route('**/api/captions', async route => {
              const body = JSON.parse(route.request().postData() || '{}');
              if (body.action === 'queue') {
                assert.strictEqual(body.source_path, 'inbox/' + 'a'.repeat(64) + '.png');
                assert(body.prompt.includes('Hinglish'));
                await route.fulfill({status:202, contentType:'application/json', body:JSON.stringify({id:'11111111-1111-4111-8111-111111111111',status:'queued'})});
              } else {
                statusCalls += 1;
                await route.fulfill({status:200, contentType:'application/json', body:JSON.stringify({id:body.id,status:'complete',result_path:'inbox/' + 'b'.repeat(64) + '.webp',attempts:1})});
              }
            });
            await page.route('**/api/library', async route => {
              const body = JSON.parse(route.request().postData() || '{}');
              assert.strictEqual(body.action, 'fetch');
              await route.fulfill({status:200, contentType:'application/json', body:JSON.stringify({image:pngData})});
            });
            const response = await page.goto('http://127.0.0.1:4173/studio/', {waitUntil:'networkidle'});
            assert(response && response.ok());
            assert(!(await page.locator('#prompt').isDisabled()), 'AI prompt should be live');
            assert(await page.locator('#generate').isDisabled(), 'Generate should wait for token/source/prompt');
            await page.fill('#token', 'test-studio-token');
            await page.setInputFiles('#file', '/tmp/source.png');
            await page.fill('#prompt', 'Make a friendly Hinglish reaction');
            await page.waitForFunction(() => !document.querySelector('#generate').disabled);
            await page.click('#generate');
            await page.waitForFunction(() => document.querySelector('#status').textContent.includes('AI sticker ready'), null, {timeout:10000});
            assert.strictEqual(uploadCalls, 1, 'Local source should be uploaded once before queueing');
            assert.strictEqual(statusCalls, 1, 'Completed mocked request should need one status poll');
            assert((await page.locator('#status').textContent()).includes('AI sticker ready'));
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            assert(overflow <= 1, `mobile overflow ${overflow}`);
            console.log(JSON.stringify({ai_prompt:'enabled',ai_queue:'pass',ai_status:'complete',result_load:'pass',mobile_overflow_px:overflow}));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Commit validated Creator Studio changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dvajjala-ui"
          git config user.email "dvajjala@gmail.com"
          git add api/_shared.py studio/index.html studio/app.js .github/workflows/creator-request-worker.yml tools/test_studio_api.py
          git diff --cached --check
          git commit -m "Enable live Creator Studio AI queue"
          git push origin HEAD:feat/creator-studio-live-ai
