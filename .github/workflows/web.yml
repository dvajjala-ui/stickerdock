name: Web and API checks
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'studio/**'
      - 'api/**'
      - 'tools/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'studio/**'
      - 'api/**'
      - 'tools/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web.yml'
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install media test tools
        run: bash tools/ci_media_tools.sh
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt -r tools/requirements-checks.txt
      - name: Verify local source-text screening with real OCR
        run: |
          bash tools/ci_text_tools.sh
          python tools/check_text_screening.py
      - name: Validate web scripts and API
        run: |
          node --check admin/app.js
          node --check admin/collect.js
          node --check admin/sources.js
          node --check studio/app.js
          python -m ruff check api tools --select F821,F822,F823
          python -m unittest discover -s tools -p 'test_*.py' -q
      - name: Validate private AI migration and grants locally
        run: |
          cd tools/sqlcheck
          npm ci --ignore-scripts
          npm test
      - name: Verify Creator admission with concurrent PostgreSQL sessions
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python tools/check_creator_admission.py --docker-container "$POSTGRES_TEST_CONTAINER"

      - name: Verify Sources workspace in a real browser with fixture APIs
        run: |
          npm install --prefix "$RUNNER_TEMP/stickerdock-ui" --no-save playwright@1.64.1
          node "$RUNNER_TEMP/stickerdock-ui/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/stickerdock-ui/node_modules/playwright" node tools/source_workspace_browser.cjs
