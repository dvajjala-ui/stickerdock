name: Runtime credential smoke

on:
  push:
    branches:
      - chore/production-runtime-defaults
    paths:
      - '.github/workflows/runtime-credential-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-runtime-defaults

      - name: Verify secret presence without printing values
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_SERVICE_ROLE_KEY", "GROQ_API_KEY")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          print("SUPABASE_SERVICE_ROLE_KEY: present; type=" + ("sb_secret" if key.startswith("sb_secret_") else "legacy"))
          print("GROQ_API_KEY: present")
          PY

      - name: Patch Groq HTTP client signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/daily_stickers.py")
          text = path.read_text()
          old = 'def fetch_bytes(url, payload=None, headers=None):\n    request = urllib.request.Request(url, data=payload, headers=headers or {})'
          new = 'def fetch_bytes(url, payload=None, headers=None):\n    request_headers = {"User-Agent": "StickerDock/0.1", **(headers or {})}\n    request = urllib.request.Request(url, data=payload, headers=request_headers)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one fetch_bytes request construction, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Install helper test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt

      - name: Run full helper suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools
          python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Read-only Supabase smoke
        shell: bash
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json
          from supabase_factory import PRIVATE_BUCKET, PUBLIC_BUCKET, SupabaseFactory

          client = SupabaseFactory()
          rows = json.loads(client._request("GET", "/rest/v1/factory_runs?select=day,status&limit=1") or b"[]")
          if not isinstance(rows, list):
              raise SystemExit("Unexpected factory_runs response")
          private_rows = client.list_objects(PRIVATE_BUCKET, "", limit=1)
          public_rows = client.list_objects(PUBLIC_BUCKET, "", limit=1)
          print(f"Supabase Data API authenticated; factory_runs_rows={len(rows)}")
          print(f"Supabase Storage authenticated; private_sample={len(private_rows)} public_sample={len(public_rows)}")
          PY

      - name: Read-only Groq credential and model smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ["GROQ_API_KEY"]
          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={
                  "Authorization": "Bearer " + key,
                  "User-Agent": "StickerDock/0.1",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raw = error.read(8192).decode("utf-8", "replace").replace(key, "<redacted>")
              print("Groq HTTP", error.code, raw[:1000])
              raise

          ids = {item.get("id") for item in payload.get("data", []) if isinstance(item, dict)}
          required = {"openai/gpt-oss-20b", "qwen/qwen3.8-27b"}
          missing = sorted(required - ids)
          if missing:
              raise SystemExit("Groq credentials work, but required models are unavailable: " + ", ".join(missing))
          print("Groq API authenticated; required text and vision models are available")
          PY

      - name: Commit validated Groq client fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dvajjala-ui"
          git config user.email "dvajjala@gmail.com"
          git add tools/daily_stickers.py
          git diff --cached --quiet && { echo "No Groq client change to commit"; exit 0; }
          git commit -m "Fix Groq requests behind Cloudflare"
          git push origin HEAD:chore/production-runtime-defaults
