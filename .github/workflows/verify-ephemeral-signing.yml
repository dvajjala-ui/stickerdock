name: Verify ephemeral Android release signing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-ephemeral-signing.yml'

permissions:
  contents: read

jobs:
  signing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_FILE: /tmp/stickerdock-ci.keystore
      ANDROID_KEYSTORE_PASSWORD: ci-only-store-pass-2026
      ANDROID_KEY_ALIAS: stickerdock-ci
      ANDROID_KEY_PASSWORD: ci-only-key-pass-2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Generate disposable CI signing key
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=StickerDock CI, OU=Release Verification, O=StickerDock, C=IN'
          chmod 600 "$ANDROID_KEYSTORE_FILE"
      - name: Build release APK and AAB through signing config
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -PcatalogBaseUrl='https://qqicsllktmcmvmzplsxl.supabase.co/storage/v1/object/public/sticker-factory-public/catalog/' \
            :app:assembleRelease :app:bundleRelease
      - name: Verify APK and AAB signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict -certs app/build/outputs/bundle/release/app-release.aab
          test ! -e "$GITHUB_WORKSPACE/release.keystore"
