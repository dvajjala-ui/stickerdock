name: HandNavigate daily media intake
on:
  schedule:
    - cron: '23 4 * * *' # about 09:53 Asia/Kolkata; Actions timing can be delayed
  workflow_dispatch:
concurrency:
  group: handnavigate-daily-intake
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    if: vars.HANDNAVIGATE_INTAKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HANDNAVIGATE_DAILY_BUDGET: ${{ vars.HANDNAVIGATE_DAILY_BUDGET || '20' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Enqueue enabled Admin topic plans for the outbound worker
        run: python -m tools.enqueue_collections --wait
