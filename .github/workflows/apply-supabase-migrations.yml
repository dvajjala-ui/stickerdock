name: Apply Supabase migrations

on:
  push:
    branches:
      - feat/production-sticker-factory
    paths:
      - '.github/workflows/apply-supabase-migrations.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qqicsllktmcmvmzplsxl
      POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Select authenticated connection mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "MIGRATION_MODE=linked" >> "$GITHUB_ENV"
            echo "Using Supabase access-token authentication."
          elif [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            DB_URL=$(python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{os.environ['PROJECT_REF']}:{password}@{os.environ['POOLER_HOST']}:5432/postgres?sslmode=require")
          PY
            )
            echo "MIGRATION_MODE=db-url" >> "$GITHUB_ENV"
            echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
            echo "Using database-password authentication."
          else
            echo "Neither SUPABASE_ACCESS_TOKEN nor SUPABASE_DB_PASSWORD is configured in repository secrets." >&2
            exit 2
          fi

      - name: Dry-run pending migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MIGRATION_MODE" = linked ]; then
            supabase link --project-ref "$PROJECT_REF"
            supabase db push --linked --dry-run
          else
            supabase db push --db-url "$DB_URL" --dry-run
          fi

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MIGRATION_MODE" = linked ]; then
            supabase db push --linked
          else
            supabase db push --db-url "$DB_URL"
          fi

      - name: Verify deployed schema
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          if [ "$MIGRATION_MODE" = linked ]; then
            if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
              echo "Migration applied with linked auth. Verification SQL requires DB password; use Supabase verification connector/query next." >&2
              exit 0
            fi
            DB_URL=$(python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{os.environ['PROJECT_REF']}:{password}@{os.environ['POOLER_HOST']}:5432/postgres?sslmode=require")
          PY
            )
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/verify_sticker_factory.sql
