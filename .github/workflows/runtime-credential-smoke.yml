name: Runtime credential smoke

on:
  push:
    branches:
      - chore/production-runtime-defaults
    paths:
      - '.github/workflows/runtime-credential-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-runtime-defaults

      - name: Verify secret presence without printing values
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_SERVICE_ROLE_KEY", "GROQ_API_KEY")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          print("SUPABASE_SERVICE_ROLE_KEY: present; type=" + ("sb_secret" if key.startswith("sb_secret_") else "legacy"))
          print("GROQ_API_KEY: present")
          PY

      - name: Run Supabase auth-header regression tests
        run: python -m unittest discover -s tools -p 'test_supabase_factory.py' -v

      - name: Read-only Supabase smoke
        shell: bash
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json
          from supabase_factory import PRIVATE_BUCKET, PUBLIC_BUCKET, SupabaseFactory

          client = SupabaseFactory()
          rows = json.loads(client._request("GET", "/rest/v1/factory_runs?select=day,status&limit=1") or b"[]")
          if not isinstance(rows, list):
              raise SystemExit("Unexpected factory_runs response")
          private_rows = client.list_objects(PRIVATE_BUCKET, "", limit=1)
          public_rows = client.list_objects(PUBLIC_BUCKET, "", limit=1)
          print(f"Supabase Data API authenticated; factory_runs_rows={len(rows)}")
          print(f"Supabase Storage authenticated; private_sample={len(private_rows)} public_sample={len(public_rows)}")
          PY

      - name: Diagnose Groq credential permissions safely
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ["GROQ_API_KEY"]
          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization": "Bearer " + key},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raw = error.read(8192).decode("utf-8", "replace").replace(key, "<redacted>")
              try:
                  detail = json.loads(raw)
              except ValueError:
                  detail = {"message": raw[:1000]}
              print("Groq diagnostic:", json.dumps({"status": error.code, "detail": detail}, separators=(",", ":")))
              raise SystemExit("Groq API access is blocked; diagnostic printed above")

          ids = {item.get("id") for item in payload.get("data", []) if isinstance(item, dict)}
          required = {"openai/gpt-oss-20b", "qwen/qwen3.8-27b"}
          missing = sorted(required - ids)
          if missing:
              raise SystemExit("Groq credentials work, but required models are unavailable: " + ", ".join(missing))
          print("Groq API authenticated; required text and vision models are available")
          PY
