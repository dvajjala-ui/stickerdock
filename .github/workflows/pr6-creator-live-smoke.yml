name: PR6 Creator live smoke

on:
  push:
    branches:
      - test/pr6-creator-live-20261013
    paths:
      - '.github/workflows/pr6-creator-live-smoke.yml'

permissions:
  contents: read

jobs:
  supabase-queue-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Exercise the merged scheduled-worker queue preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '').strip()
          if not key:
              raise SystemExit('SUPABASE_SERVICE_ROLE_KEY is missing')
          headers = {'apikey': key}
          key_type = 'sb_secret' if key.startswith('sb_secret_') else 'legacy'
          if key_type == 'legacy':
              headers['Authorization'] = 'Bearer ' + key
          url = os.environ['SUPABASE_URL'].rstrip('/') + '/rest/v1/creator_requests?status=eq.queued&select=id&limit=1'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              rows = json.load(response)
          print(json.dumps({'preflight': 'pass', 'key_type': key_type,
                            'queued_request_present': bool(rows)}, sort_keys=True))
          PY

  chromium-ai-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start deterministic Studio/API smoke server
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/studio_smoke_server.py <<'PY'
          import base64
          import json
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          PNG = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2sZ8AAAAASUVORK5CYII=')
          DATA_URL = 'data:image/png;base64,' + base64.b64encode(PNG).decode()
          REQUEST_ID = '11111111-1111-4111-8111-111111111111'
          SOURCE_PATH = 'inbox/' + ('a' * 64) + '.png'
          RESULT_PATH = 'inbox/' + ('b' * 64) + '.webp'
          status_calls = 0
          calls = []

          class Handler(SimpleHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

              def _json(self, status, value):
                  body = json.dumps(value).encode()
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  global status_calls
                  length = int(self.headers.get('Content-Length', '0'))
                  raw = self.rfile.read(length)
                  try:
                      body = json.loads(raw or b'{}')
                  except json.JSONDecodeError:
                      return self._json(400, {'error': 'bad json'})
                  if self.headers.get('X-StickerDock-Token') != 'smoke-token':
                      return self._json(401, {'error': 'bad token'})
                  calls.append({'path': self.path, 'body': body})
                  if self.path == '/api/upload':
                      image = body.get('image', '')
                      if not image.startswith('data:image/png;base64,'):
                          return self._json(400, {'error': 'expected png data url'})
                      return self._json(200, {'path': SOURCE_PATH, 'sha256': 'a' * 64})
                  if self.path == '/api/captions' and body.get('action') == 'queue':
                      if body.get('source_path') != SOURCE_PATH or not body.get('prompt'):
                          return self._json(400, {'error': 'bad queue payload'})
                      return self._json(200, {'id': REQUEST_ID, 'status': 'queued'})
                  if self.path == '/api/captions' and body.get('action') == 'status':
                      if body.get('id') != REQUEST_ID:
                          return self._json(400, {'error': 'bad request id'})
                      status_calls += 1
                      if status_calls == 1:
                          return self._json(200, {'id': REQUEST_ID, 'status': 'queued'})
                      return self._json(200, {'id': REQUEST_ID, 'status': 'complete', 'result_path': RESULT_PATH})
                  if self.path == '/api/library' and body.get('action') == 'fetch':
                      if body.get('path') != RESULT_PATH:
                          return self._json(400, {'error': 'bad result path'})
                      return self._json(200, {'image': DATA_URL})
                  return self._json(404, {'error': 'unexpected endpoint'})

          server = ThreadingHTTPServer(('127.0.0.1', 8765), Handler)
          server.serve_forever()
          PY
          python /tmp/studio_smoke_server.py >/tmp/studio-server.log 2>&1 &
          echo $! > /tmp/studio-server.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/studio/ >/dev/null

      - name: Exercise enabled AI flow in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2sZ8AAAAASUVORK5CYII=')
          fixture = Path('/tmp/creator-source.png')
          fixture.write_bytes(png)
          console_errors = []
          page_errors = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 390, 'height': 844})
              page.on('console', lambda msg: console_errors.append(msg.text) if msg.type == 'error' else None)
              page.on('pageerror', lambda exc: page_errors.append(str(exc)))
              response = page.goto('http://127.0.0.1:8765/studio/', wait_until='networkidle')
              assert response and response.status == 200
              assert page.locator('#generate').is_disabled()
              page.locator('#token').fill('smoke-token')
              page.locator('#prompt').fill('Make a friendly Hinglish reaction')
              page.locator('#file').set_input_files(str(fixture))
              page.locator('#status').wait_for(state='visible')
              page.wait_for_function("!document.getElementById('generate').disabled")
              page.locator('#generate').click()
              page.wait_for_function("document.getElementById('status').textContent.includes('AI sticker ready')", timeout=15000)
              assert not page.locator('#download').is_disabled()
              assert page.locator('#caption').input_value() == ''
              overflow = page.evaluate('document.documentElement.scrollWidth - document.documentElement.clientWidth')
              assert overflow == 0
              page.screenshot(path='/tmp/pr6-studio-ai.png', full_page=True)
              browser.close()

          if console_errors or page_errors:
              raise SystemExit('Browser errors: ' + json.dumps({'console': console_errors, 'page': page_errors}))
          print(json.dumps({'http': 200, 'ai_button_enablement': 'pass',
                            'source_upload': 'pass', 'queue': 'pass',
                            'status_poll': 'pass', 'result_load': 'pass',
                            'mobile_overflow_px': 0, 'browser_errors': 0}, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pr6-creator-ai-chromium-smoke
          retention-days: 3
          path: /tmp/pr6-studio-ai.png
