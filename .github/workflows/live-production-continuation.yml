name: Live production continuation

on:
  push:
    branches:
      - test/live-factory-smoke-20261013
    paths:
      - '.github/workflows/live-production-continuation.yml'

permissions:
  contents: read

jobs:
  continue-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_TEXT_MODEL: openai/gpt-oss-20b
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
      FACTORY_DAILY_TARGET: '40'
      FACTORY_RATING: GENERAL
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-factory-smoke-20261013

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-stickers.txt

      - name: Install production rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt

      - name: Continue using the real production config
        shell: bash
        run: |
          set -euo pipefail
          python tools/production_worker.py --config tools/factory-production.json | tee /tmp/production-summary.json

      - name: Verify persisted continuation state
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          from datetime import datetime, timezone
          import io
          import json
          import zipfile
          from supabase_factory import PRIVATE_BUCKET, PUBLIC_BUCKET, SupabaseFactory

          client = SupabaseFactory()
          day = datetime.now(timezone.utc).date().isoformat()
          run = client.find("factory_runs", "day", day)
          if not run:
              raise SystemExit("factory_runs row is missing")
          if run.get("status") != "running" or int(run.get("generated") or 0) != 10 or int(run.get("target") or 0) != 40:
              raise SystemExit("production continuation did not advance to 10/40: " + json.dumps(run, default=str))

          state_bytes = client.download(PRIVATE_BUCKET, "state/runtime.zip")
          if not state_bytes:
              raise SystemExit("persistent runtime state is missing")
          with zipfile.ZipFile(io.BytesIO(state_bytes)) as archive:
              state_name = f"generated-stickers/{day}/state.json"
              if state_name not in archive.namelist():
                  raise SystemExit("today's generator state is missing from runtime.zip")
              state = json.loads(archive.read(state_name))
              if len(state.get("records", [])) != 10:
                  raise SystemExit("runtime.zip did not preserve 10 generated records")
              library_assets = 0
              if "reference-images/library.json" in archive.namelist():
                  library = json.loads(archive.read("reference-images/library.json"))
                  library_assets = len(library.get("assets", []))

          pack = client.find("sticker_packs", "day", day)
          if not pack or pack.get("status") != "pending" or int(pack.get("sticker_count") or 0) != 5:
              raise SystemExit("the verified 5-sticker pending smoke pack changed unexpectedly")
          public_objects = client.list_objects(PUBLIC_BUCKET, "", limit=10)
          if public_objects:
              raise SystemExit("public bucket should still be empty before approval/publish")

          print(json.dumps({
              "day": day,
              "factory_status": run.get("status"),
              "generated": run.get("generated"),
              "target": run.get("target"),
              "attempts": run.get("attempts"),
              "persistent_records": len(state.get("records", [])),
              "reference_library_assets": library_assets,
              "pending_smoke_pack_stickers": pack.get("sticker_count"),
              "public_bucket_objects": len(public_objects),
          }, sort_keys=True))
          PY
