name: Apply Supabase migrations

on:
  push:
    branches:
      - feat/production-sticker-factory
    paths:
      - '.github/workflows/apply-supabase-migrations.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qqicsllktmcmvmzplsxl
      POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
      POOLER_PORT: '5432'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD is not configured." >&2
            exit 2
          fi
          DB_URL=$(python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(
              f"postgresql://postgres.{os.environ['PROJECT_REF']}:{password}"
              f"@{os.environ['POOLER_HOST']}:{os.environ['POOLER_PORT']}/postgres?sslmode=require"
          )
          PY
          )
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Dry-run pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$DB_URL"

      - name: Verify deployed schema
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql \
            "host=$POOLER_HOST port=$POOLER_PORT dbname=postgres user=postgres.$PROJECT_REF sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -f supabase/verify_sticker_factory.sql
