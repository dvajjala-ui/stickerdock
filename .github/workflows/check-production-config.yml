name: Check production configuration

on:
  push:
    branches:
      - feat/production-sticker-factory
    paths:
      - '.github/workflows/check-production-config.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      GROQ_TEXT_MODEL: ${{ vars.GROQ_TEXT_MODEL }}
      GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL }}
      FACTORY_DAILY_TARGET: ${{ vars.FACTORY_DAILY_TARGET }}
      STICKER_FACTORY_ENABLED: ${{ vars.STICKER_FACTORY_ENABLED }}
      SUPABASE_STORAGE_QUOTA_MB: ${{ vars.SUPABASE_STORAGE_QUOTA_MB }}
      SUPABASE_STORAGE_WARN_PERCENT: ${{ vars.SUPABASE_STORAGE_WARN_PERCENT }}
      SUPABASE_STORAGE_FAIL_PERCENT: ${{ vars.SUPABASE_STORAGE_FAIL_PERCENT }}
      STORAGE_MONITOR_ENABLED: ${{ vars.STORAGE_MONITOR_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Report configured production settings
        shell: bash
        run: |
          python - <<'PY'
          import os
          names = [
              'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'GROQ_API_KEY',
              'PINTEREST_ACCESS_TOKEN', 'GROQ_TEXT_MODEL', 'GROQ_VISION_MODEL',
              'FACTORY_DAILY_TARGET', 'STICKER_FACTORY_ENABLED',
              'SUPABASE_STORAGE_QUOTA_MB', 'SUPABASE_STORAGE_WARN_PERCENT',
              'SUPABASE_STORAGE_FAIL_PERCENT', 'STORAGE_MONITOR_ENABLED',
          ]
          for name in names:
              print(f'{name}=' + ('SET' if os.environ.get(name, '').strip() else 'MISSING'))
          PY

      - name: Read-only Supabase service-role smoke check
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'Authorization': 'Bearer ' + key}

          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, response.read()

          for table in ('factory_runs', 'sticker_packs', 'creator_requests'):
              status, body = get('/rest/v1/' + table + '?select=*&limit=1')
              data = json.loads(body or b'[]')
              print(f'{table}: HTTP {status}, rows_returned={len(data)}')

          status, body = get('/storage/v1/bucket')
          buckets = json.loads(body or b'[]')
          ids = {item.get('id') for item in buckets if isinstance(item, dict)}
          print(f'storage buckets: HTTP {status}')
          print('sticker-factory-private=' + ('PRESENT' if 'sticker-factory-private' in ids else 'MISSING'))
          print('sticker-factory-public=' + ('PRESENT' if 'sticker-factory-public' in ids else 'MISSING'))
          PY
