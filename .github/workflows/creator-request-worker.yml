name: Creator request worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: creator-request-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
      - name: Check for queued or recoverable Creator work
        id: queue
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
          headers = {'apikey': key}
          if not key.startswith('sb_secret_'):
              headers['Authorization'] = 'Bearer ' + key
          params = urllib.parse.urlencode({
              'status': 'in.(queued,running)',
              'select': 'id,status',
              'limit': 1,
          })
          url = os.environ['SUPABASE_URL'].rstrip('/') + '/rest/v1/creator_requests?' + params
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              rows = json.load(response)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('has_queue=' + ('true' if rows else 'false') + '\n')
          print('Creator work found' if rows else 'Creator queue is empty')
          PY
      - uses: actions/setup-python@v5
        if: steps.queue.outputs.has_queue == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-stickers.txt
      - name: Install rendering dependencies
        if: steps.queue.outputs.has_queue == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt
      - name: Verify creator worker configuration
        if: steps.queue.outputs.has_queue == 'true'
        run: |
          python - <<'PY'
          import os
          required = ("GROQ_API_KEY", "SUPABASE_SERVICE_ROLE_KEY")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing Creator worker secrets: " + ", ".join(missing))
          PY
      - name: Process up to five queued Creator requests
        if: steps.queue.outputs.has_queue == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..5}; do
            result=$(python tools/creator_request_worker.py)
            echo "$result"
            if [[ "$result" == *'"status":"idle"'* ]]; then
              break
            fi
          done
