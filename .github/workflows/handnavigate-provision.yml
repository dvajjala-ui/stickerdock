name: Provision HandNavigate intake
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: handnavigate-provision
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
      HANDNAVIGATE_INGEST_TOKEN: ${{ secrets.HANDNAVIGATE_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10' Pillow==11.3.0
      - run: python -m tools.provision_handnavigate
