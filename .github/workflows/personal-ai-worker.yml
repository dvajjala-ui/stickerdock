name: Private caption worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: personal-ai-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-one:
    if: vars.PERSONAL_AI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-stickers.txt
      - name: Install image validation and provider dependencies
        run: python -m pip install -r tools/requirements-stickers.txt
      - name: Process up to five account-owned requests
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..5}; do
            result=$(python tools/personal_ai_worker.py)
            echo "$result"
            if [[ "$result" == *'"status":"idle"'* ]]; then break; fi
          done
