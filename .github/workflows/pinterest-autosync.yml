name: Pinterest source sync

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pinterest-autosync-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.PINTEREST_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_IDS: ${{ vars.PINTEREST_BOARD_IDS }}
      PINTEREST_DAILY_TARGET: ${{ vars.PINTEREST_DAILY_TARGET }}
      PINTEREST_PER_RUN: ${{ vars.PINTEREST_PER_RUN }}
      PINTEREST_UNOFFICIAL_ENABLED: ${{ vars.PINTEREST_UNOFFICIAL_ENABLED }}
      PINTEREST_TOPICS: ${{ vars.PINTEREST_TOPICS }}
      PINTEREST_PIN_RIGHTS_JSON: ${{ secrets.PINTEREST_PIN_RIGHTS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-stickers.txt
            tools/requirements-pinterest.txt
            tools/requirements-pinterest-unofficial.txt
      - name: Install Pinterest sync dependencies
        run: |
          python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt
          if [ "$PINTEREST_UNOFFICIAL_ENABLED" = "true" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
            python -m pip install -r tools/requirements-pinterest-unofficial.txt
          fi
      - name: Sync one bounded batch to the private factory inbox
        run: python tools/pinterest_worker.py --config tools/pinterest-production.json
