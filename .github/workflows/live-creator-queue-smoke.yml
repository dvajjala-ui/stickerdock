name: Live Creator queue smoke

on:
  push:
    branches:
      - test/live-factory-smoke-20261013
    paths:
      - '.github/workflows/live-creator-queue-smoke.yml'

permissions:
  contents: read

jobs:
  creator-queue-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
      PYTHONPATH: tools:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-factory-smoke-20261013

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-stickers.txt

      - name: Install creator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt

      - name: Create isolated source and queue through Studio API helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import urllib.parse
          from PIL import Image, ImageDraw
          from api._shared import queue_creator_request
          from supabase_factory import PRIVATE_BUCKET, SupabaseFactory

          client = SupabaseFactory()
          queued = json.loads(client._request(
              'GET', '/rest/v1/creator_requests?status=eq.queued&select=id&limit=2') or b'[]')
          if queued:
              raise SystemExit('Refusing smoke test because a pre-existing Creator request is queued')

          image = Image.new('RGB', (512, 512), '#f4c84a')
          draw = ImageDraw.Draw(image)
          draw.ellipse((96, 86, 416, 406), fill='#f07f3c')
          draw.ellipse((180, 180, 220, 220), fill='black')
          draw.ellipse((292, 180, 332, 220), fill='black')
          draw.arc((185, 220, 327, 335), 10, 170, fill='black', width=16)
          output = io.BytesIO()
          image.save(output, format='PNG', optimize=True)
          data = output.getvalue()
          digest = hashlib.sha256(data).hexdigest()
          source_path = f'inbox/{digest}.png'
          metadata_path = f'source-metadata/{digest}.json'
          metadata = {
              'source': 'creator-live-smoke',
              'source_url': 'creator-smoke://generated',
              'download_url': 'creator-smoke://generated',
              'license': 'USER_OWNED',
              'credit': 'StickerDock production smoke fixture'
          }
          client.upload(PRIVATE_BUCKET, source_path, data, 'image/png')
          client.upload(PRIVATE_BUCKET, metadata_path,
                        json.dumps(metadata, separators=(',', ':')).encode(), 'application/json')

          queued_request = queue_creator_request(
              "Create a friendly Hinglish reaction sticker with a short excited caption like 'Arre wah!'",
              source_path)
          row = client.find('creator_requests', 'id', queued_request['id'])
          if not row or row.get('status') != 'queued' or row.get('source_path') != source_path:
              raise SystemExit('Creator request was not queued correctly')
          with open('/tmp/creator-smoke.json', 'w') as handle:
              json.dump({'id': queued_request['id'], 'source_path': source_path,
                         'source_metadata_path': metadata_path}, handle)
          print(json.dumps({'queued': True, 'id': queued_request['id'],
                            'source_bytes': len(data)}, sort_keys=True))
          PY

      - name: Process exactly the isolated request with live Groq vision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          from PIL import Image
          from creator_request_worker import process_one
          from supabase_factory import PRIVATE_BUCKET, SupabaseFactory

          with open('/tmp/creator-smoke.json') as handle:
              state = json.load(handle)
          client = SupabaseFactory()
          result = process_one(client, worker_id='creator-live-smoke')
          if result.get('status') != 'complete' or result.get('id') != state['id']:
              raise SystemExit('Worker did not complete the isolated Creator request: ' + json.dumps(result))
          row = client.find('creator_requests', 'id', state['id'])
          if not row or row.get('status') != 'complete' or row.get('attempts') != 1:
              raise SystemExit('Completed Creator row has unexpected state: ' + json.dumps(row, default=str))
          result_path = row.get('result_path')
          if not result_path:
              raise SystemExit('Creator result path is missing')
          result_bytes = client.download(PRIVATE_BUCKET, result_path)
          if not (result_bytes and result_bytes.startswith(b'RIFF') and result_bytes[8:12] == b'WEBP'):
              raise SystemExit('Creator result is not a WebP object')
          with Image.open(io.BytesIO(result_bytes)) as image:
              image.load()
              if image.format != 'WEBP' or getattr(image, 'is_animated', False):
                  raise SystemExit('Creator result is not a valid static WebP')
              dimensions = [image.width, image.height]
          result_digest = result_path.split('/')[-1].split('.')[0]
          result_metadata_path = f'source-metadata/{result_digest}.json'
          metadata = json.loads(client.download(PRIVATE_BUCKET, result_metadata_path))
          if metadata.get('creator_request_id') != state['id'] or metadata.get('derived_from') != state['source_path']:
              raise SystemExit('Creator result provenance metadata is incorrect')
          state.update({'result_path': result_path, 'result_metadata_path': result_metadata_path})
          with open('/tmp/creator-smoke.json', 'w') as handle:
              json.dump(state, handle)
          print(json.dumps({'status': row.get('status'), 'attempts': row.get('attempts'),
                            'result_bytes': len(result_bytes), 'dimensions': dimensions,
                            'result_path_suffix': result_path.rsplit('.', 1)[-1]}, sort_keys=True))
          PY

      - name: Clean isolated Creator smoke data
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          from supabase_factory import PRIVATE_BUCKET, SupabaseFactory

          path = '/tmp/creator-smoke.json'
          if not os.path.exists(path):
              print('No smoke state file; nothing to clean')
              raise SystemExit(0)
          with open(path) as handle:
              state = json.load(handle)
          client = SupabaseFactory()
          deleted = []
          for key in ('result_metadata_path', 'result_path', 'source_metadata_path', 'source_path'):
              value = state.get(key)
              if not value:
                  continue
              endpoint = client._object_path(PRIVATE_BUCKET, value)
              client._request('DELETE', '/storage/v1/object/' + endpoint, missing_ok=True)
              deleted.append(value)
          request_id = state.get('id')
          if request_id:
              client._request('DELETE', '/rest/v1/creator_requests?id=eq.' + urllib.parse.quote(request_id),
                              headers={'Prefer': 'return=minimal'})
          print(json.dumps({'cleanup': 'complete', 'objects_deleted': len(deleted),
                            'request_deleted': bool(request_id)}, sort_keys=True))
          PY
