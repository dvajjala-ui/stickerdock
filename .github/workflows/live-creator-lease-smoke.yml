name: Live Creator lease recovery smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-creator-lease-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://qqicsllktmcmvmzplsxl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify stale running request is safely reclaimed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request
          import uuid

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
          headers = {'apikey': key, 'Content-Type': 'application/json'}
          if not key.startswith('sb_secret_'):
              headers['Authorization'] = 'Bearer ' + key

          request_id = str(uuid.uuid4())
          source_path = 'inbox/' + ('e' * 64) + '.png'
          stale_started = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(minutes=21)).isoformat()
          row = [{
              'id': request_id,
              'source_path': source_path,
              'prompt': 'lease recovery smoke',
              'status': 'running',
              'attempts': 1,
              'worker_id': 'interrupted-worker',
              'created_at': '2000-01-01T00:00:00+00:00',
              'started_at': stale_started,
          }]

          def call(path, method='GET', body=None, extra_headers=None):
              outgoing = dict(headers)
              if extra_headers:
                  outgoing.update(extra_headers)
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              request = urllib.request.Request(base + path, data=data, method=method, headers=outgoing)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None

          inserted = False
          try:
              call('/rest/v1/creator_requests', 'POST', row, {'Prefer': 'return=minimal'})
              inserted = True
              claimed = call('/rest/v1/rpc/claim_creator_request', 'POST',
                             {'p_worker_id': 'lease-live-smoke'})
              if not isinstance(claimed, list) or len(claimed) != 1:
                  raise SystemExit('claim_creator_request did not return exactly one row')
              result = claimed[0]
              expected = {
                  'id': request_id,
                  'status': 'running',
                  'attempts': 2,
                  'worker_id': 'lease-live-smoke',
              }
              for field, value in expected.items():
                  if result.get(field) != value:
                      raise SystemExit(f'lease recovery mismatch for {field}: {result.get(field)!r}')
              if not result.get('started_at') or result.get('error_message') is not None:
                  raise SystemExit('reclaimed row did not receive a fresh clean lease')
              print(json.dumps({'lease_recovery': 'pass', 'attempts': result['attempts'],
                                'status': result['status']}, sort_keys=True))
          finally:
              if inserted:
                  encoded = urllib.parse.quote(request_id, safe='')
                  call('/rest/v1/creator_requests?id=eq.' + encoded, 'DELETE', None,
                       {'Prefer': 'return=minimal'})
                  print('lease_smoke_cleanup=complete')
          PY
