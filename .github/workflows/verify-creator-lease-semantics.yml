name: Verify Creator lease semantics

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-creator-lease-semantics.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qqicsllktmcmvmzplsxl
      POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Verify rollback-only stale lease recovery
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo 'SUPABASE_DB_PASSWORD is not configured' >&2
            exit 2
          fi
          DB_URL=$(python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{os.environ['PROJECT_REF']}:{password}@{os.environ['POOLER_HOST']}:5432/postgres?sslmode=require")
          PY
          )
          echo "::add-mask::$DB_URL"

          RESULT=$(psql "$DB_URL" -XqAt -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          do $$
          begin
            if exists (
              select 1
              from public.creator_requests
              where status in ('queued', 'running')
            ) then
              raise exception 'Creator queue is not empty; refusing semantic lease smoke';
            end if;
          end
          $$;

          insert into public.creator_requests (
            id, source_path, prompt, status, attempts, worker_id, started_at, updated_at
          ) values (
            gen_random_uuid(),
            'inbox/' || repeat('f', 64) || '.png',
            'rollback-only lease recovery smoke',
            'running',
            1,
            'expired-smoke-worker',
            now() - interval '25 minutes',
            now() - interval '25 minutes'
          ) returning id \gset smoke_

          set local role service_role;
          select
            (id = :'smoke_id'::uuid)::int,
            status,
            attempts,
            worker_id,
            (started_at > now() - interval '1 minute')::int
          from public.claim_creator_request('lease-smoke-worker');

          reset role;
          rollback;
          SQL
          )

          test "$RESULT" = '1|running|2|lease-smoke-worker|1'
          echo "lease_semantics=$RESULT"

          REMAINING=$(psql "$DB_URL" -XqAt -v ON_ERROR_STOP=1 -c \
            "select count(*) from public.creator_requests where prompt='rollback-only lease recovery smoke';")
          test "$REMAINING" = '0'
          echo 'Creator stale lease recovery semantics verified with rollback-only test'
