name: Verify Android 16 KB page compatibility

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-16kb-pages.yml'

permissions:
  contents: read

jobs:
  page-size:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify 16 KB ZIP and ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 "$APK"
          rm -rf /tmp/stickerdock-native
          mkdir -p /tmp/stickerdock-native
          unzip -q "$APK" 'lib/*/*.so' -d /tmp/stickerdock-native
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('/tmp/stickerdock-native/lib')
          checked = []
          for abi in ('arm64-v8a', 'x86_64'):
              folder = root / abi
              if not folder.exists():
                  continue
              for so in sorted(folder.glob('*.so')):
                  out = subprocess.check_output(['readelf', '-lW', str(so)], text=True)
                  aligns = []
                  for line in out.splitlines():
                      if line.lstrip().startswith('LOAD '):
                          token = line.split()[-1]
                          aligns.append(int(token, 16))
                  if not aligns:
                      raise SystemExit(f'No LOAD segments found in {abi}/{so.name}')
                  minimum = min(aligns)
                  print(f'{abi}/{so.name}: minimum LOAD alignment=0x{minimum:x}')
                  if minimum < 0x4000:
                      raise SystemExit(f'16 KB ELF alignment failed for {abi}/{so.name}')
                  checked.append(f'{abi}/{so.name}')
          if not checked:
              raise SystemExit('Expected 64-bit native libraries but none were found')
          print('16 KB ELF alignment verified:', ', '.join(checked))
          PY
