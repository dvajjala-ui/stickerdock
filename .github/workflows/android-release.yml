name: Signed Android release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'sticker-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'tools/prepare_android_release.py'
      - 'tools/emulator_library_acceptance.py'
      - 'tools/emulator_clip_creator_smoke.py'
      - 'tools/emulator_recovery_smoke.py'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

concurrency:
  group: android-release-candidate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-production
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CATALOG_BASE_URL: ${{ vars.CATALOG_BASE_URL || 'https://qqicsllktmcmvmzplsxl.supabase.co/storage/v1/object/public/sticker-factory-public/catalog/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt -r tools/requirements-checks.txt
      - name: Verify backend and release helpers
        run: |
          python -m ruff check api tools --select F821,F822,F823
          python -m unittest discover -s tools -p 'test_*.py' -v
          node --check admin/app.js
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the android-production environment"
              exit 2
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
      - name: Test and build signed APK/AAB
        run: |
          set -euo pipefail
          test -n "$CATALOG_BASE_URL"
          gradle --no-daemon -PcatalogBaseUrl="$CATALOG_BASE_URL" \
            :sticker-core:jvmTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify signed APK/AAB
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | tee /tmp/aab-verify.log
          grep -q 'jar verified' /tmp/aab-verify.log
      - name: Prepare versioned APK, bundle and checksums
        id: package
        run: python tools/prepare_android_release.py --apk app/build/outputs/apk/release/app-release.apk --bundle app/build/outputs/bundle/release/app-release.aab
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify exact signed APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          # Use the supported GLES software backend; these UI checks do not need Vulkan.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: python tools/emulator_library_acceptance.py --apk work/release/StickerDock.apk --output work/android-acceptance
      - name: Publish latest successful Android download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="android-v$VERSION"
          if gh release view "$TAG" --json targetCommitish > /tmp/existing-release.json 2>/dev/null; then
            test "$(python -c 'import json; print(json.load(open("/tmp/existing-release.json"))["targetCommitish"])')" = "$GITHUB_SHA" || { echo 'Bump the Android version before publishing changed source'; exit 1; }
            gh release upload "$TAG" work/release/StickerDock.apk work/release/StickerDock.aab work/release/SHA256SUMS.txt work/release/release.json work/android-acceptance/acceptance.json --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "StickerDock Android $VERSION" --notes-file work/release/release-notes.md --latest work/release/StickerDock.apk work/release/StickerDock.aab work/release/SHA256SUMS.txt work/release/release.json work/android-acceptance/acceptance.json
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stickerdock-release-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            work/release/
            work/android-acceptance/*.json
            work/android-acceptance/*.png
            work/android-acceptance/meminfo.txt
            work/android-acceptance/*diagnostic.log
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.html
            sticker-core/build/test-results/
