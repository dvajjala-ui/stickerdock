name: Verify current Python action runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-python-action.yml'

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-stickers.txt
            tools/requirements-pinterest.txt
      - name: Run production helper regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt
          python -m unittest discover -s tools -p 'test_*.py' -v
