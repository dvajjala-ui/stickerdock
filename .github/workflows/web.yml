name: Web and API checks
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'studio/**'
      - 'api/**'
      - 'tools/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'studio/**'
      - 'api/**'
      - 'tools/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web.yml'
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install media test tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt -r tools/requirements-checks.txt
      - name: Validate web scripts and API
        run: |
          node --check admin/app.js
          node --check studio/app.js
          python -m ruff check api tools --select F821,F822,F823
          python -m unittest discover -s tools -p 'test_*.py' -q
      - name: Validate private AI migration and grants locally
        run: |
          cd tools/sqlcheck
          npm ci --ignore-scripts
          npm test
