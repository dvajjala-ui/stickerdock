name: Verify Python production helpers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-python-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-stickers.txt
            tools/requirements-pinterest.txt

      - name: Install helper dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r tools/requirements-stickers.txt -r tools/requirements-pinterest.txt

      - name: Compile production Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q api tools

      - name: Run full helper regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -v
